[project]
name = "statsrag"
version = "0.3.19"
description = "Offline-first RAG helper for statistical analysis specification and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.31",
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.6",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "tabulate>=0.9.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
excel = [
  "openpyxl>=3.1",
  "xlrd>=2.0",
]
embeddings = [
  "sentence-transformers[onnx]>=2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
